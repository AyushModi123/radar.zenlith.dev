# Render Blueprint for the radar signaling server.
# Deploy: push this repo, then "New +" → "Blueprint" in the Render dashboard
# and point it at the repo. Render builds the Dockerfile and runs the binary.
#
# The frontend is deployed separately to Cloudflare Pages (see README); this
# service only needs to expose the /ws signaling endpoint (and /health).
services:
  - type: web
    name: radar-ws
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # Render injects PORT; main.go reads it and falls back to 8080 locally.
    envVars:
      - key: PORT
        value: 8080
